[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isonome"
version = "0.1.0"
description = "Agentic robotics framework with hierarchical cognitive architecture"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "anthropic>=0.20",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
sim = ["pybullet>=3.2"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1"]

[project.scripts]
isonome = "isonome.cli:app"
