[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isonome"
version = "0.2.0"
description = "Open-source runtime for embodied AI — Frozen Brain + Learned Nervous System"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
pi0 = ["lerobot"]
vla = ["transformers", "torch"]
sim = ["pybullet"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1"]

[project.scripts]
isonome = "isonome.cli:app"
